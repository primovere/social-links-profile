<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main>
      <div class="card">
        <img
          class="avatar"
          src="assets/images/avatar-jessica.jpeg"
          alt="Jessica's avatar"
        />
        <h1 class="name">Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
        <p class="intro">"Front-end developer and avid reader."</p>

        <nav class="links">
          <a href="http://github.com" class="social-link">GitHub</a>
          <a href="https://frontendmentor.io" class="social-link"
            >Frontend Mentor</a
          >
          <a href="https://linkedin.com" class="social-link">LinkedIn</a>
          <a href="https://twitter.com" class="social-link">Twitter</a>
          <a href="https://instagram.com" class="social-link">Instagram</a>
        </nav>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/primovere/">primovere</a>.
    </footer>
  </body>
</html>
